{% load i18n %}

<div class="container">
    <div class="row mb-5">
      <div class="col">
        <h2 class="text-center">{% translate 'Future Events' %}</h2>
      </div>
    </div>
    <div class="d-flex flex-wrap justify-content-center g-4">
      {% for event in future_events %}
        <div class="d-flex justify-content-center mb-4" style="flex: 0 0 33%; max-width: 33%;">
          <div class="card h-100" style="width: 100%; max-width: 300px;">
            <img src="{{ event.featured_image.url }}" class="card-img-top" alt="{{ event.event_name }}" />
            <div class="card-body">
              <h5 class="card-title">{{ event.event_name }}</h5>
              <p class="card-text">{{ event.description|truncatewords:20 }}</p>
              <a href="{% url 'event_detail' event.id %}" class="btn btn-primary">{% translate 'See Details' %}</a>
            </div>
          </div>
        </div>
      {% empty %}
        <div class="col">
          <p class="text-muted text-center text-warning">
            {% translate 'No upcoming events found.' %}
          </p>
        </div>
      {% endfor %}
    </div>
    <hr class="mt-5" />
  </div>
