{% load i18n %}
<div class="container my-3" id="faq-section">
  <div class="row">
    <div class="col">
      <h2 class="text-center">{% translate 'Frequently Asked Questions' %}</h2>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col">
        <div class="accordion" id="faqs">
            {% for faq in faqs %}
            <div class="accordion-item">
                <h2 class="accordion-header" id="heading-{{ faq.id }}">
                    <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ faq.id }}" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="collapse-{{ faq.id }}">
                        {{ faq.question }}
                    </button>
                </h2>
                <div id="collapse-{{ faq.id }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#faqs">
                    <div class="accordion-body">
                        {{ faq.answer }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
    </div>
  </div>
</div>
