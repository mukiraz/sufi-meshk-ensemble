{% load static %}
{% load i18n %}
<section class="container mt-5">
  <div class="row mb-5">
    <div class="col">
      <h2 class="text-center">{% translate "Gallery" %}</h2>
    </div>
  </div>

  <div id="sufi_meshk_gallery" class="carousel slide">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{{MEDIA_URL}}gallery/1.jpeg" class="d-block w-100" alt="Sufi Meshk Ensemble">
      </div>
      <div class="carousel-item">
        <img src="{{MEDIA_URL}}gallery/2.jpeg" class="d-block w-100" alt="Sufi Meshk Ensemble">
      </div>
      <div class="carousel-item">
        <img src="{{MEDIA_URL}}gallery/3.jpeg" class="d-block w-100" alt="Sufi Meshk Ensemble">
      </div>
      <div class="carousel-item">
        <img src="{{MEDIA_URL}}gallery/4.jpeg" class="d-block w-100" alt="Sufi Meshk Ensemble">
      </div>
      <div class="carousel-item">
        <img src="{{MEDIA_URL}}gallery/5.jpeg" class="d-block w-100" alt="Sufi Meshk Ensemble">
      </div>
      
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#sufi_meshk_gallery" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#sufi_meshk_gallery" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <div class="col my-4 text-center">
    <a href="#" style="text-decoration: none;"><button class="btn btn-primary">{% translate "Click For More Images..." %}</button></a>
  </div>
  <hr class="mt-5">
</section>
