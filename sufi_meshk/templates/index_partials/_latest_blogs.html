{% load i18n %}

<div class="container">
    <div class="row mb-5">
      <div class="col">
        <h2 class="text-center">{% translate 'Latest Blogs' %}</h2>
      </div>
    </div>
    <div class="row d-flex justify-content-center">
      {% for latest_blog in latest_blogs %}
        <div class="col-md-4 mb-3 d-flex justify-content-center">
          <div class="card" style="width: 100%;">
            <img src="{{ latest_blog.featured_image.url }}" class="card-img-top" alt="{{ latest_blog.title }}" />
            <div class="card-body text-center">
              <h5 class="card-title">{{ latest_blog.title }}</h5>
              <p class="card-text">{{ latest_blog.short_description|truncatewords:25}}</p>
              <a href="{% url 'blog_detail' latest_blog.slug %}" class="btn btn-primary">{% translate 'See Details' %}</a>
            </div>
          </div>
        </div>
      {% empty %}
        
      
      {% endfor %}
    </div>
    <hr class="mt-5" />
  </div>
