{% load i18n %}

<!-- Modal -->
<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalLabel">{% translate "Upcoming Events" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                {% if future_events %}
                <div class="row d-flex justify-content-center">
                    {% for event in future_events|slice:":3" %}
                    <div class="col-md-4 mb-3 d-flex justify-content-center">
                        <div class="card" style="width: 100%;">
                            <img src="{{ event.featured_image.url }}" class="card-img-top" alt="{{ event.event_name }}" />
                            <div class="card-body text-center">
                                <h5 class="card-title">{{ event.event_name }}</h5>
                                <a href="{{ event.ticket_link }}" class="btn btn-primary" target="_blank">{% translate "Buy Tickets" %}</a>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
