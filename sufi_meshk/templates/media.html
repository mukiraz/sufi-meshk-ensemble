{% extends 'layout.html' %}
{% load static %}

{% block meta %}
    {% include "_metatags_partials.html" %}
{% endblock %}


{% block main %}
  <div class="container mt-5">
    <div class="row">
        <div class="col">
            <h2 class="text-center">Media</h2>
        </div>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-4 mt-3">
      {% for image in images %}
        <div class="col">
          <div class="card">
            <img src="{{ image }}" alt="Gallery Image" class="img-fluid" data-bs-toggle="modal" data-bs-target="#carouselModal" onclick="setActiveSlide({{ forloop.counter0 }})" />
          </div>
        </div>
      {% endfor %}
    </div>
  </div>


  

    <!-- Modal -->
    <div class="modal fade" id="carouselModal" tabindex="-1" aria-labelledby="carouselModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
          <div class="modal-content">
              <div class="modal-body">
                  <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
                      <div class="carousel-inner">
                          {% for image in images %}
                          <div class="carousel-item">
                              <img src="{{ image }}" class="d-block w-100" alt="Gallery Image">
                          </div>
                          {% endfor %}
                      </div>
                      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                          <span class="visually-hidden">Previous</span>
                      </button>
                      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                          <span class="carousel-control-next-icon" aria-hidden="true"></span>
                          <span class="visually-hidden">Next</span>
                      </button>
                  </div>
              </div>
          </div>
      </div>
  </div>
  
  <script>
      function setActiveSlide(index) {
          var carouselItems = document.querySelectorAll('.carousel-item');
          carouselItems.forEach(function(item) {
              item.classList.remove('active');
          });
          carouselItems[index].classList.add('active');
      }
  </script>
{% endblock %}
