- name: Obtain SSL Certificate with Let's Encrypt
  hosts: web
  become: yes
  vars:
    domain_name: "sufimeshk.org"
    email: "mukiraz@gmail.com"

  tasks:
    - name: Install Certbot and Nginx plugin
      apt:
        name: 
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Configure Nginx temporary for SSL validation
      copy:
        dest: /etc/nginx/sites-available/{{ domain_name }}
        content: |
          server {
              listen 80;
              server_name {{ domain_name }} www.{{ domain_name }};

              location /.well-known/acme-challenge/ {
                  root /var/www/html;
                  allow all;
              }

              location / {
                  return 404;
              }
          }
      notify:
        - Restart Nginx

    - name: Link Nginx site configuration
      file:
        src: /etc/nginx/sites-available/{{ domain_name }}
        dest: /etc/nginx/sites-enabled/{{ domain_name }}
        state: link
        force: yes

    - name: Ensure webroot directory exists
      file:
        path: /var/www/html/.well-known/acme-challenge/
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Debug webroot content
      shell: |
        ls -l /var/www/html/.well-known/acme-challenge/
        cat /var/www/html/.well-known/acme-challenge/test.txt
      register: debug_result

    - name: Display debug content
      debug:
        var: debug_result.stdout_lines

    - name: Test webroot directory accessibility
      shell: |
        echo "test" > /var/www/html/.well-known/acme-challenge/test.txt
      register: test_file_result

    - name: Check test file availability
      uri:
        url: "http://{{ domain_name }}/.well-known/acme-challenge/test.txt"
        return_content: yes
      register: test_accessibility
      retries: 3
      delay: 10
      until: test_accessibility.status == 200

    - name: Display test file result
      debug:
        msg: "{{ test_accessibility }}"

    - name: Obtain SSL certificate with Certbot
      command: >
        certbot certonly --webroot
        -w /var/www/html
        -d {{ domain_name }}
        -d www.{{ domain_name }}
        --email {{ email }}
        --non-interactive
        --agree-tos
      register: certbot_result
      retries: 3
      delay: 10
      failed_when: "'The Certificate Authority reported these problems' in certbot_result.stderr"

    - name: Display Certbot result
      debug:
        var: certbot_result

    - name: Verify and download Let's Encrypt SSL options
      shell: |
        if [ ! -f /etc/letsencrypt/options-ssl-nginx.conf ]; then
          curl -o /etc/letsencrypt/options-ssl-nginx.conf https://raw.githubusercontent.com/certbot/certbot/main/certbot/certbot/options-ssl-nginx.conf
        fi
      args:
        warn: false

    - name: Generate DH params if not exist
      shell: |
        if [ ! -f /etc/letsencrypt/ssl-dhparams.pem ]; then
          openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
        fi
      args:
        warn: false

    - name: Configure Nginx for HTTPS
      copy:
        dest: /etc/nginx/sites-available/{{ domain_name }}
        content: |
          server {
              listen 80;
              server_name {{ domain_name }} www.{{ domain_name }};
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name {{ domain_name }} www.{{ domain_name }};

              ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

              location /static/ {
                  root /var/www/sufi-meshk;
              }

              location /media/ {
                  root /var/www/sufi-meshk;
              }

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify:
        - Restart Nginx

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      failed_when: nginx_test.rc != 0

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
      when: nginx_test.rc == 0

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
